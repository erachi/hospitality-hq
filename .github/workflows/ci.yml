name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: >
          Git SHA or ref to deploy. Defaults to the triggering ref.
          Only takes effect when run from the main branch.
        required: false
        default: ""

permissions:
  id-token: write   # OIDC token for AWS AssumeRoleWithWebIdentity (deploy job)
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.5
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install -r tests/requirements-test.txt
      - name: pytest with coverage gate
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          SSM_PREFIX: /hospitality-hq-test
          SLACK_CHANNEL_ID: C_TEST
          PROPERTY_UUIDS: test-prop-1,test-prop-2
          DYNAMODB_TABLE: hospitality-hq-messages-test
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=60

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: sam validate --lint
        run: sam validate --lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit on src requirements
        run: pip-audit -r src/requirements.txt

  deploy:
    # Runs on push-to-main after all checks pass, and on manual workflow_dispatch.
    # Never runs on pull_request — guard prevents accidental prod deploys from a PR branch.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    needs: [lint, test, template, security]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: sam build
        run: sam build

      - name: sam deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar \
            --parameter-overrides AlarmEmail=${{ vars.ALARM_EMAIL }}
