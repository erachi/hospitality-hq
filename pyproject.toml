[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".aws-sam", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (formatter handles most; leave long strings alone)
    "B008",  # function call in default argument (common for dataclass field defaults)
    "B019",  # lru_cache on methods — used intentionally for Lambda cold-start caching
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine
