  - name: Appliances
    slug: appliances
    items:
    - id: 619306
      content: 'Projector setup instructions: Strap the projector to the stand and set it up behind the
        bean bags (near the tree is ideal). Use the black extension cord for the speakers and the grey
        one for the projector. Turn on the projector using the remote or button on the projector. Focus
        the lens for a clear picture. Use the main remote to navigate to Bluetooth to pair the speakers.
        You can screen mirror from your device or use Roku. Navigate to HDMI to access Roku and use the
        Roku remote to access apps. When finished, please bring the projector, stand, and accessories
        back inside. They are kept in the master bedroom closet.'
      original_content: 'Projector setup instructions: Strap the projector to the stand and set it up
        behind the bean bags (near the tree is ideal). Use the black extension cord for the speakers and
        the grey one for the projector. Turn on the projector using the remote or button on the projector.
        Focus the lens for a clear picture. Use the main remote to navigate to Bluetooth to pair the speakers.
        You can screen mirror from your device or use Roku. Navigate to HDMI to access Roku and use the
        Roku remote to access apps. Return the projector, stand, and accessories to the master bedroom
        closet after use.'
      is_edited: true
      state: ready
