  - name: Vendor Policies
    slug: vendor_policies
    items:
    - id: 2060513
      content: Vendors such as private chefs, photographers, and yoga instructors are welcome. Please
        message the host ahead of time, and services that wrap up before 10 PM work best. DJs and entertainers
        aren't a fit for this home. The property accommodates up to 16 guests and welcomes bachelorette
        groups, provided the house rules are followed.
      original_content: All vendor activities, including private chefs, require proof of liability insurance,
        which can be submitted by taking a screenshot and sharing it directly in the chat. All vendor
        services must conclude by 10 PM to adhere to quiet hours. Cabana boys, entertainers, or similar
        services are not allowed on the property; guests should refer to the house rules for a list of
        approved vendor types. The property accommodates up to 16 guests and welcomes bachelorette groups,
        provided house rules are followed.
      is_edited: true
