    slug: amenities
    items:
    - id: 619082
      content: 'The firepit uses propane stored in the white table. To operate: turn on the gas, push
        and hold the igniter button while turning the control knob to LOW. Once ignited, control the temperature
        with the knob. Turn off the flame and propane after use, and allow the pit to cool before replacing
        the cover. Troubleshooting steps for the firepit are provided for issues like ignition failure,
        burner not lighting, black smoke emission, flame blowing out, and sudden gas flow drop.'
