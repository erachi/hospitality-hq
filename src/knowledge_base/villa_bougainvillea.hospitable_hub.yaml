  - name: Check-out Procedures
    slug: check_out_procedures
    items:
    - id: 4246652
      content: Before check-out, guests are encouraged to put used dishes in the sink, gather used towels
        in the bathroom, put trash and recycling in the indoor bins, and turn off the lights and AC. Please
        double check that the fire pit and grill propane is off, make sure the projector is inside, and
        return outdoor games to the deck box. There is no need to strip beds or start laundry. The coffee
        bar includes a machine compatible with Keurig and other pods as well as a regular drip coffee
        maker.
      original_content: Guests should start the dishwasher if there are any dirty dishes and take out
        the trash before checking out, but they do not need to strip beds or start laundry. The coffee
        bar includes a machine compatible with Keurig and other pods as well as a regular drip coffee
        maker.
      is_edited: true
