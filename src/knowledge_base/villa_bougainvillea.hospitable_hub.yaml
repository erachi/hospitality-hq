  - name: Check-in Policies
    slug: check_in_policies
    items:
    - id: 1850219
      content: Early check-in is available for a fee of $75 for up to two hours early or $150 for more
        than two hours early. The fee is processed through Airbnb after the guest completes the booking.
        Guests can request early check-in by sharing their desired arrival time, and the host will confirm
        availability closer to the date based on other guests’ departure times and our cleaning and QA
        teams’ schedules.
