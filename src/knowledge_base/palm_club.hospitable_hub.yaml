  - name: Amenities
    slug: amenities
    items:
    - id: 6675951
      content: 'The outdoor grill is connected to natural gas (no propane needed). To operate: push and
        turn each burner knob counterclockwise to the 9 o''clock position, then press the ignite button
        on the right side. Grill tools are stored in the kitchen drawer.'
      original_content: null
      is_edited: false
      state: ready
      last_updated_via: mcp
      sources: []
      updated_at: '2026-11-02T23:30:23.000000Z'
    - id: 6675970
      content: 'The large fire pit is connected to natural gas. To light it: turn the silver knob counterclockwise
        until you hear the gas flowing, then use the long lighter (stored in the kitchen drawer with the
        BBQ utensils) to ignite the flame. Please ensure the fire pit is fully turned off after use.'
      original_content: null
      is_edited: false
