    slug: check_out_procedures
    items:
    - id: 6675956
      content: Standard checkout is at 11:00 AM. Late checkout until 2:00 PM may be available depending
        on the cleaning team's schedule and may include a small fee. Please request early to confirm.
      original_content: null
      is_edited: false
      state: ready
      last_updated_via: mcp
